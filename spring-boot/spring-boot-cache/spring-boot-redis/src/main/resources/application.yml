spring:
    datasource:
        url: jdbc:mysql://localhost:3307/spring_redis?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
        username: root
        password: root
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect
                format_sql: true
        open-in-view: false

    cache:
        type: redis
        redis:
            time-to-live: 600000          # 10 phút (ms) - cache tự hết hạn
            cache-null-values: false      # Không cache giá trị null
            use-key-prefix: true          # Thêm prefix cho key

    data:
        redis:
            host: localhost
            port: 6379
