server:
    port: 8080

spring:
    application:
        name: spring-ai

    servlet:
        multipart:
            enabled: true
            max-file-size: 10MB
            max-request-size: 10MB
    ai:
        openai:
            api-key: ${GEMINI_KEY}
            chat:
                base-url: https://generativelanguage.googleapis.com
                completions-path: /v1beta/openai/chat/completions
                options:
                    model: gemini-3.8-flash
